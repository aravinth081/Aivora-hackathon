<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Neural Link Not Found | AIVORA 2K26</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080D1B;
      color: #F8FAFC;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 217, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 217, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .glow-orb {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(0, 217, 255, 0.08) 50%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      animation: float 8s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translate(-30px, -20px) scale(0.95); }
      100% { transform: translate(30px, 20px) scale(1.05); }
    }
    .container {
      position: relative;
      z-index: 10;
      max-width: 540px;
      width: 100%;
      text-align: center;
      background: rgba(17, 28, 51, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      padding: 48px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 217, 255, 0.1);
    }
    .glitch-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 88px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #00D9FF 0%, #3B82F6 50%, #8B5CF6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      letter-spacing: -2px;
      text-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(0, 217, 255, 0.1);
      border: 1px solid rgba(0, 217, 255, 0.3);
      color: #00D9FF;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #00D9FF 0%, #3B82F6 100%);
      color: #080D1B;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 217, 255, 0.5);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #F8FAFC;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 217, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow-orb"></div>
  
  <div class="container">
    <div class="badge">AIVORA 2K26</div>
    <div class="glitch-code">404</div>
    <h1>Neural Synapse Disconnected</h1>
    <p>The coordinate or portal link you requested does not exist in our AI network matrix or has moved to an updated namespace.</p>
    <div class="actions">
      <a href="/" class="btn-primary">
        <span>← Return to Portal</span>
      </a>
      <a href="/control" class="btn-secondary">
        <span>Admin Panel</span>
      </a>
    </div>
  </div>
</body>
</html>
