<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" fill="none" preserveAspectRatio="none" style="width: 100%; height: 100%;">
  <defs>
    <!-- Cyan-to-Sapphire Wave Gradient 1 (Mirrored) -->
    <linearGradient id="aboutWaveGrad1_r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.90" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.65" />
    </linearGradient>

    <!-- Deep Electric Cyan Wave Gradient 2 (Mirrored) -->
    <linearGradient id="aboutWaveGrad2_r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.75" />
    </linearGradient>

    <!-- Front Sapphire Accent Wave Gradient 3 (Mirrored) -->
    <linearGradient id="aboutWaveGrad3_r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0.98" />
      <stop offset="60%" stop-color="#0369A1" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Vector Resonance Lines (Mirrored) -->
    <linearGradient id="aboutLineGrad1_r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="aboutLineGrad2_r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.90" />
      <stop offset="60%" stop-color="#60A5FA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glowCyan_r" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Back Wave (Soft Organic Harmonic - Mirrored) -->
  <path d="M540,60 C400,85 260,150 120,215 C75,236 35,248 0,252 L0,260 L540,260 Z" fill="url(#aboutWaveGrad1_r)" />

  <!-- Mid-Tier Dynamic Cyber Wave (Curving S-Crest - Mirrored) -->
  <path d="M540,105 C430,115 320,175 180,225 C120,245 60,255 0,258 L0,260 L540,260 Z" fill="url(#aboutWaveGrad2_r)" />

  <!-- Front Power Swoosh (Mirrored) -->
  <path d="M540,155 C450,160 350,205 220,242 C160,252 90,258 0,260 L540,260 Z" fill="url(#aboutWaveGrad3_r)" />

  <!-- Harmonic Luminous Resonance Contour Lines (Mirrored) -->
  <path d="M540,45 C390,65 250,135 90,205 C55,220 25,232 0,240" stroke="url(#aboutLineGrad1_r)" stroke-width="1.8" filter="url(#glowCyan_r)" />
  <path d="M540,32 C380,52 230,122 70,192 C40,205 15,216 0,225" stroke="url(#aboutLineGrad2_r)" stroke-width="1.4" />
  <path d="M540,20 C370,40 210,110 50,180 C28,192 10,202 0,210" stroke="url(#aboutLineGrad1_r)" stroke-width="1.0" />
  <path d="M540,10 C360,28 190,98 30,168 C18,175 8,182 0,190" stroke="url(#aboutLineGrad2_r)" stroke-width="0.8" stroke-dasharray="6 3" />

  <!-- Floating Energy Node Accents (Mirrored) -->
  <circle cx="350" cy="80" r="2.5" fill="#67E8F9" opacity="0.85" />
  <circle cx="220" cy="138" r="2" fill="#38BDF8" opacity="0.75" />
  <circle cx="110" cy="195" r="2.5" fill="#22D3EE" opacity="0.8" />
</svg>
